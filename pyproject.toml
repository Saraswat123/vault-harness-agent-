[project]
name = "vault-harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["deepagents>=0.7,<0.8", "langgraph>=1.2,<1.3", "langchain-openai>=1.7,<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vault_harness"]
